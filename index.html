const L = D.lang==="en"?"en":"it", T = I18N[L], P = D.project;
const LOC = L==="en"?"en-GB":"it-IT";
const fonti = Object.fromEntries(D.sources.map(f=>[f.id,f]));
const money = v => v==null||v==="" ? "" : new Intl.NumberFormat(LOC,{style:"currency",currency:D.budget.currency||"EUR",maximumFractionDigits:0}).format(v);
const mln = v => new Intl.NumberFormat(LOC,{maximumFractionDigits:1}).format(v/1e6)+(L==="en"?" m":" mln");
const MESI = L==="en"?["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]:["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const fdata = s => { if(!s) return ""; const p=String(s).split("-"); if(p.length===1) return p[0]; if(p.length===2) return MESI[+p[1]-1]+" "+p[0]; return (+p[2])+" "+MESI[+p[1]-1]+" "+p[0]; };
const host = u => { try { return new URL(u).hostname.replace(/^www\d*\./,"").replace(/^accountability-backend\./,""); } catch(e){ return ""; } };
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const ids = s => String(s||"").split(",").map(x=>x.trim()).filter(x=>fonti[x]);
const srcHTML = s => ids(s).map(i=>`<a href="${esc(fonti[i].url)}" target="_blank" rel="noopener" title="${esc(fonti[i].publisher+": "+fonti[i].title)}">${i} · ${host(fonti[i].url)} ↗</a>`).join("");
const srcList = s => ids(s).map(i=>`<li><b>${i}</b> <a href="${esc(fonti[i].url)}" target="_blank" rel="noopener">${esc(fonti[i].title)}</a> — ${esc(fonti[i].publisher)} <span class="who">(${host(fonti[i].url)})</span></li>`).join("");
const th = cols => `<tr>${cols.map(c=>`<th${c.r?' style="text-align:right"':""}>${c.t}</th>`).join("")}</tr>`;
document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[e.dataset.t]||"");

// summary cards + status
(function(){
  const B=D.budget, eac=B.eac||[], act=B.actual||[], S=D.schedule||[];
  const last=eac[eac.length-1], first=eac[0];
  const lastAct = act.length? act[act.length-1] : null;
  const steps=S.filter(s=>s.status), done=steps.filter(s=>s.status==="done").length;
  const delays=S.filter(s=>s.delay);
  const cards=[];
  if(last) cards.push({v:mln(last.amount),l:`${T.c_eac}${B.eac_scope?" – "+B.eac_scope:""} (${fdata(last.date)})`,s:last.sources});
  if(first&&last&&first!==last) cards.push({v:`${last.amount>=first.amount?"+":""}${new Intl.NumberFormat(LOC,{maximumFractionDigits:0}).format((last.amount/first.amount-1)*100)}%`,l:`${T.c_var} (${mln(first.amount)}, ${fdata(first.date)})`,s:first.sources+","+last.sources});
  cards.push(lastAct?{v:mln(lastAct.amount),l:`${T.c_actual}${B.actual_scope?" – "+B.actual_scope:""} (${fdata(lastAct.date)})`,s:lastAct.sources}:{v:T.c_na,l:T.c_na_l,s:""});
  if(steps.length) cards.push({v:`${done}/${steps.length}`,l:T.c_steps,s:""});
  if(delays.length) cards.push({v:`${delays.length}`,l:T.c_delays+": "+delays.map(d=>`${d.item} (${d.delay})`).join("; "),s:""});
  document.getElementById("cards").innerHTML = cards.map(c=>`<div class="num"><div class="v">${c.v}</div><div class="l">${esc(c.l)}</div><div class="src" style="margin-top:6px">${srcHTML(c.s)}</div></div>`).join("");
  const st=(D.status||[]);
  document.getElementById("status").innerHTML = st.length?`<ul>${st.map(s=>`<li>${esc(s.text)} <span class="src">${srcHTML(s.sources)}</span></li>`).join("")}</ul>`:"";
  if(!st.length) document.getElementById("status").style.display="none";
})();

// gantt
(function(){
  const G=D.schedule||[], today=new Date(P.updated);
  const PD=s=>s?new Date(s):null;
  const dates=G.flatMap(g=>[g.start,g.end,g.planned]).filter(Boolean).map(s=>new Date(s).getFullYear());
  const ymin=Math.min(...dates, today.getFullYear()), ymax=Math.max(...dates, today.getFullYear())+1;
  const zooms=[[T.zoom_all,ymin,ymax+0.4]];
  const span=ymax-ymin; if(span>6){ const a=Math.ceil(span/3); for(let y=ymin;y<ymax;y+=a) zooms.push([`${y}-${Math.min(y+a,ymax)-1}`,y,Math.min(y+a,ymax+0.4)]); }
  let z=0, sel=null;
  document.getElementById("g-legend").innerHTML=[["bar","lg_bar"],["late","lg_late"],["run","lg_run"],["ms","lg_ms"],["plan","lg_plan"],["today","lg_today"]].map(([c,k])=>`<span><i class="lg ${c}"></i>${T[k]}</span>`).join("");
  document.getElementById("g-detail").textContent=T.select;
  function draw(){
    document.getElementById("g-zoom").innerHTML=zooms.map((q,i)=>`<button class="${i===z?"on":""}" data-z="${i}">${q[0]}</button>`).join("");
    document.querySelectorAll("#g-zoom button").forEach(b=>b.onclick=()=>{z=+b.dataset.z;draw();});
    const [,y0,y1]=zooms[z];
    const cw=document.getElementById("g-wrap").clientWidth||800, narrow=cw<600, LW=narrow?150:240, W=Math.max(cw,narrow?680:760), PW=W-LW-10, RH=26, ML=narrow?22:36;
    const t0=new Date(Math.floor(y0),Math.round((y0%1)*12),1), t1=new Date(Math.floor(y1),Math.round((y1%1)*12),1);
    const X=d=>LW+(d-t0)/(t1-t0)*PW, inR=d=>d&&d>=t0&&d<=t1, clip=d=>new Date(Math.min(Math.max(d,t0),t1));
    let rows=[],y=24,lastG="";
    G.forEach((g,i)=>{ if(g.group!==lastG){rows.push({hdr:g.group,y});y+=RH;lastG=g.group;} rows.push({g,i,y}); y+=RH; });
    const H=y+8;
    let s=`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="12">`;
    for(let yr=Math.ceil(y0);yr<=Math.floor(y1);yr++){ const x=X(new Date(yr,0,1)); if(x>W-30) continue; s+=`<line x1="${x}" y1="18" x2="${x}" y2="${H}" stroke="#e4e6ea"/><text x="${x+3}" y="13" fill="#5b616e">${yr}</text>`; }
    rows.forEach(r=>{
      if(r.hdr){ s+=`<text x="4" y="${r.y+17}" font-weight="700" fill="#16181d">${esc(r.hdr)}</text>`; return; }
      const g=r.g, cy=r.y+RH/2, a=PD(g.start), b=PD(g.end), pv=PD(g.planned);
      s+=`<g class="row${sel===r.i?" sel":""}" data-i="${r.i}" style="cursor:pointer"><rect class="hit" x="0" y="${r.y}" width="${W}" height="${RH}" fill="transparent"/>`;
      s+=`<text x="12" y="${cy+4}" fill="#16181d" font-size="${narrow?11:12}">${esc(g.item.length>ML?g.item.slice(0,ML-1)+"…":g.item)}</text>`;
      if(g.kind==="phase"&&a&&b&&b>=t0&&a<=t1){ const xa=X(clip(a)),xb=X(clip(b));
        if(pv&&pv<b&&pv>a){ const xp=X(clip(pv)); s+=`<rect x="${xa}" y="${cy-6}" width="${Math.max(2,xp-xa)}" height="12" rx="2" fill="#16181d"/><rect x="${xp}" y="${cy-6}" width="${Math.max(2,xb-xp)}" height="12" fill="url(#late)"/>`; }
        else s+=`<rect x="${xa}" y="${cy-6}" width="${Math.max(3,xb-xa)}" height="12" rx="2" fill="#16181d"/>`; }
      if(g.kind==="running"&&a&&a<=t1){ const xa=X(clip(a)),xb=X(clip(today)); s+=`<rect x="${xa}" y="${cy-6}" width="${Math.max(3,xb-xa)}" height="12" rx="2" fill="#b7791f"/>`; }
      if(g.kind==="milestone"&&inR(a)){ const x=X(a); s+=`<rect x="${x-5}" y="${cy-5}" width="10" height="10" transform="rotate(45 ${x} ${cy})" fill="#16181d"/>`; }
      if(pv&&inR(pv)){ const x=X(pv); s+=`<rect x="${x-5}" y="${cy-5}" width="10" height="10" transform="rotate(45 ${x} ${cy})" fill="#fff" stroke="#c8312b" stroke-width="2"/>`; }
      if(g.kind==="undated") s+=`<text x="${LW+4}" y="${cy+4}" fill="#5b616e" font-style="italic">${T.no_date}</text>`;
      if(g.delay&&g.kind==="phase"&&b&&inR(b)) s+=`<text x="${X(b)+6}" y="${cy+4}" fill="#c8312b" font-weight="700">${esc(String(g.delay).startsWith("+")?g.delay:"+"+g.delay)}</text>`;
      s+=`</g>`; });
    if(inR(today)){ const x=X(today); s+=`<line x1="${x}" y1="18" x2="${x}" y2="${H}" stroke="#2b5fa8" stroke-width="2"/><text x="${x-4}" y="${H-4}" fill="#2b5fa8" text-anchor="end" font-weight="700">${T.today}</text>`; }
    s+=`<defs><pattern id="late" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3c6c3"/><rect width="3" height="6" fill="#c8312b"/></pattern></defs></svg>`;
    document.getElementById("g-wrap").innerHTML=s;
    document.querySelectorAll("#g-wrap .row").forEach(el=>el.addEventListener("click",()=>{sel=+el.dataset.i;show(G[sel]);draw();}));
  }
  function show(g){ const r=[];
    if(g.start) r.push(`<b>${g.end||g.kind==="running"?T.d_start:T.d_date}:</b> ${fdata(g.start)}`);
    if(g.end) r.push(`<b>${T.d_end}:</b> ${fdata(g.end)}`);
    if(g.kind==="running") r.push(`<b>${T.d_state}:</b> ${T.st_run}`);
    if(g.planned) r.push(`<b>${T.d_plan}:</b> ${fdata(g.planned)}`);
    if(g.delay) r.push(`<b class="red">${T.d_delay}: ${esc(g.delay)}</b>`);
    document.getElementById("g-detail").innerHTML=`<h3>${esc(g.item)}</h3><div>${r.join(" · ")}</div><p style="margin:6px 0">${esc(g.note||"")}</p><b>${T.sources}</b><ul>${srcList(g.sources)}</ul>`; }
  draw(); window.addEventListener("resize",draw);
})();

(function(){

  (S.description||[]).forEach(d=>h+=`<p>${esc(d.text)} <span class="src">${srcHTML(d.sources)}</span></p>`);
  if((S.features||[]).length) h+=`<h3>${T.scope_feat}</h3><table>${S.features.map(f=>`<tr><td>${esc(f.item)}</td><td><b>${esc(f.value)}</b></td><td class="src">${srcHTML(f.sources)}</td></tr>`).join("")}</table>`;
  if((S.changes||[]).length) h+=`<h3 style="margin-top:16px">${T.scope_changes}</h3><table>${S.changes.map(c=>`<tr><td style="white-space:nowrap">${fdata(c.date)}</td><td>${esc(c.text)}</td><td class="src">${srcHTML(c.sources)}</td></tr>`).join("")}</table>`;
  document.getElementById("scope").innerHTML=h||T.none;
})();

// budget
function bars(el,rows,cls){ if(!rows.length){el.innerHTML=T.none;return;} const max=Math.max(...rows.map(r=>r.v));
  el.innerHTML=rows.map(r=>{const w=r.v/max*100,out=w<38;return `<div class="bar-row"><div><b>${r.k}</b></div><div class="bar-track"><div class="bar-fill ${cls||""}" style="width:${w}%"></div><span class="bar-lab ${out?"out":""}" style="${out?`left:calc(${w}% + 8px)`:""}">${mln(r.v)}</span></div><div class="bar-note">${esc(r.n)} <span class="src">${srcHTML(r.s)}</span></div></div>`;}).join(""); }
(function(){
  const B=D.budget;
  bars(document.getElementById("bars-eac"),(B.eac||[]).map(c=>({k:fdata(c.date),v:c.amount,n:c.what,s:c.sources})));
  const A=B.actual||[];
  document.querySelector("#tab-actual thead").innerHTML=A.length?th([{t:T.th_date},{t:T.th_item},{t:T.th_amount,r:1},{t:T.th_src}]):"";
  document.querySelector("#tab-actual tbody").innerHTML=A.length?A.map(a=>`<tr><td>${fdata(a.date)}</td><td>${esc(a.what)}</td><td class="n">${money(a.amount)}</td><td class="src">${srcHTML(a.sources)}</td></tr>`).join(""):`<tr><td>${esc(B.actual_note||T.c_na_l)}</td></tr>`;
  const F=B.funding||[];
  document.querySelector("#tab-fund thead").innerHTML=th([{t:T.th_source_fin},{t:T.th_date},{t:T.th_amount,r:1},{t:T.th_src}]);
  document.querySelector("#tab-fund tbody").innerHTML=F.length?F.map(f=>`<tr><td>${esc(f.source)}</td><td>${fdata(f.date)}</td><td class="n">${f.amount?money(f.amount):"—"}</td><td class="src">${srcHTML(f.sources)}</td></tr>`).join("")+`<tr class="tot"><td>${T.total}</td><td></td><td class="n">${money(F.reduce((s,f)=>s+(f.amount||0),0))}</td><td></td></tr>`:`<tr><td>${T.none}</td></tr>`;
  const R=D.related_works||[], last=(B.eac||[]).slice(-1)[0];
  document.querySelector("#tab-related thead").innerHTML=th([{t:T.th_item},{t:T.th_who},{t:T.th_amount,r:1},{t:T.th_src}]);
  const rows=(last?[{work:P.name+" – EAC",who:"",amount:last.amount,sources:last.sources}]:[]).concat(R);
  document.querySelector("#tab-related tbody").innerHTML=R.length?rows.map(r=>`<tr><td>${esc(r.work)}${r.note?`<div class="note" style="margin:2px 0 0">${esc(r.note)}</div>`:""}</td><td>${esc(r.who||"")}</td><td class="n">${r.amount?money(r.amount):"—"}</td><td class="src">${srcHTML(r.sources)}</td></tr>`).join("")+`<tr class="tot"><td>${T.total_ours}</td><td></td><td class="n">${money(rows.reduce((s,r)=>s+(r.amount||0),0))}</td><td></td></tr>`:`<tr><td>${T.none}</td></tr>`;
})();

// risks & opportunities
(function(){
  const R=D.risks||[]; const f=k=>{const x=R.filter(r=>r.type===k); return x.length?x.map(r=>`<div class="ro-item"><b>${esc(r.title)}</b>${esc(r.text)}${r.state?` <span class="tag">${esc(r.state)}</span>`:""}<div class="src" style="margin-top:4px">${srcHTML(r.sources)}</div></div>`).join(""):T.none;};
  document.getElementById("risks").innerHTML=f("risk"); document.getElementById("opps").innerHTML=f("opportunity");
})();

// claims
(function(){ const C=D.claims||[];
  document.getElementById("claims").innerHTML=C.length?C.map(p=>`<div class="promise"><div class="who">${fdata(p.date)}</div><div><div class="when">${esc(p.claim)}</div><div class="who">${esc(p.who)} <span class="src">${srcHTML(p.sources)}</span></div></div></div>`).join(""):T.none; })();

// update log
(function(){ const U=(D.updates||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const sec=document.getElementById("aggiornamenti"); if(!U.length){sec.style.display="none";return;}
  document.querySelector("#tab-upd thead").innerHTML=th([{t:T.th_upd_date},{t:T.th_upd_what},{t:T.th_upd_new}]);
  document.querySelector("#tab-upd tbody").innerHTML=U.map(u=>`<tr><td><b>${fdata(u.date)}</b></td><td data-l="${T.th_upd_what}">${esc(u.summary||"")}</td><td data-l="${T.th_upd_new}" class="src">${u.added?srcHTML(u.added):"—"}</td></tr>`).join(""); })();

// data gaps
(function(){ const G=D.gaps||[];
  document.querySelector("#tab-gaps thead").innerHTML=th([{t:T.th_section},{t:T.th_missing},{t:T.th_note}]);
  document.querySelector("#tab-gaps tbody").innerHTML=G.length?G.map(g=>`<tr><td>${esc(g.section)}</td><td data-l="${T.th_missing}"><b>${esc(g.item)}</b></td><td data-l="${T.th_note}">${esc(g.note||"")} <span class="src">${srcHTML(g.sources)}</span></td></tr>`).join(""):`<tr><td>—</td></tr>`; })();

// events timeline
(function(){ const E=D.events||[]; const groups=[T.all,...new Set(E.map(e=>e.group).filter(Boolean))]; let f=T.all;
  function draw(){ document.getElementById("filters").innerHTML=groups.map(g=>`<button class="${g===f?"on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
    document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{f=b.dataset.g;draw();});
    document.getElementById("tl").innerHTML=E.filter(e=>f===T.all||e.group===f).map(e=>`<li><div class="d">${fdata(e.date)}${e.group?`<span class="tag">${esc(e.group)}</span>`:""}</div><p class="e">${esc(e.text)}</p><span class="src">${srcHTML(e.sources)}</span></li>`).join(""); }
  draw(); })();

// documents
document.querySelector("#tab-docs thead").innerHTML=th([{t:T.th_doc},{t:T.th_phase},{t:T.th_src}]);
document.querySelector("#tab-docs tbody").innerHTML=(D.documents||[]).map(d=>`<tr><td>${esc(d.document)}</td><td>${esc(d.phase||"")}</td><td class="src">${srcHTML(d.sources)}</td></tr>`).join("")||`<tr><td>${T.none}</td></tr>`;

// sources
document.getElementById("lista-fonti").innerHTML=D.sources.map(f=>`<li><span class="id">${f.id}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a> — ${esc(f.publisher)}<span class="tipo ${f.official?"":"press"}">${esc(f.type)}</span><div class="u">${esc(f.url)}</div></li>`).join("");

// data downloads
document.getElementById("data-lead").innerHTML=T.data_lead+(P.repo_url?` <a href="${esc(P.repo_url)}" target="_blank" rel="noopener">GitHub</a>`:"");
document.getElementById("dl").innerHTML=Object.keys(CSV).map(f=>`<div class="dl-row"><span class="name">${f}</span><a href="data/${f}" target="_blank" rel="noopener">${T.open}</a><button data-f="${f}">${T.copy}</button><span class="msg" id="m-${f.replace(/\W/g,'_')}"></span></div>`).join("");
document.querySelectorAll("#dl button").forEach(b=>b.onclick=async()=>{const m=document.getElementById("m-"+b.dataset.f.replace(/\W/g,'_'));try{await navigator.clipboard.writeText(CSV[b.dataset.f]);m.textContent=T.copy_ok;}catch(e){m.textContent=T.copy_ko;}});

// footer
(function(){ const A=P.author||{}; const parts=[];
  if(A.name) parts.push(esc(A.name)); if(A.github) parts.push(`<a href="https://github.com/${esc(A.github)}" target="_blank" rel="noopener">github.com/${esc(A.github)}</a>`); if(A.email) parts.push(`<a href="mailto:${esc(A.email)}">${esc(A.email)}</a>`);
  document.getElementById("footer").innerHTML=`${T.curated} ${parts.join(" · ")}<br>${T.license} <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>: ${T.cite} «${esc(P.name)} – ${esc(A.name||"")}».${P.repo_url?` ${T.code}: <a href="${esc(P.repo_url)}" target="_blank" rel="noopener">${esc(P.repo_url.replace(/^https?:\/\//,""))}</a>`:""}`; })();

// GoatCounter events (optional)
document.addEventListener("click",ev=>{ const a=ev.target.closest(".sh, #dl a, #dl button"); if(!a||!window.goatcounter||!window.goatcounter.count) return;
  try{ const path=a.dataset.net?"share-"+a.dataset.net:a.id==="sh-copy"?"share-copy-link":a.dataset.f?"data-copy-"+a.dataset.f:"data-open-"+(a.getAttribute("href")||"").split("/").pop(); window.goatcounter.count({path,title:path,event:true}); }catch(e){} });
</script>

</body>
</html>
